# Hooks run by prek (https://github.com/j178/prek). Install with `prek install`.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (deny warnings)
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-clippy-wasi
        name: cargo clippy wasi (deny warnings)
        entry: cargo clippy --all-targets --target wasm32-wasip2 --no-default-features --features wasi -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test-doc
        name: cargo test --doc
        entry: cargo test --doc
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test-wasi
        name: cargo test wasi (needs wasmtime)
        entry: cargo test --lib --target wasm32-wasip2 --no-default-features --features wasi
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-semver-checks
        name: cargo semver-checks
        entry: cargo semver-checks --default-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      # Host target: cargo-semver-checks fails to build rustdoc with `--target wasm32-wasip2`.
      - id: cargo-semver-checks-wasi
        name: cargo semver-checks wasi
        entry: cargo semver-checks --only-explicit-features --features wasi
        language: system
        types_or: [rust, toml]
        pass_filenames: false
