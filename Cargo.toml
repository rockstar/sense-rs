[package]
name = "sense-rs"
version = "0.1.0"
edition = "2024"
description = "Unofficial async and blocking client for the Sense energy monitor API"
license = "MIT"
keywords = ["sense", "energy", "home-automation", "power"]
categories = ["api-bindings"]

[lib]
name = "sense"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", features = ["form", "query"] }
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "io-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
