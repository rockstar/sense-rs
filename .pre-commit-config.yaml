# Hooks run by prek (https://github.com/j178/prek). Install with `prek install`.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (deny warnings)
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test-doc
        name: cargo test --doc --all-features
        entry: cargo test --doc --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-semver-checks
        name: cargo semver-checks
        entry: cargo semver-checks
        language: system
        types_or: [rust, toml]
        pass_filenames: false
