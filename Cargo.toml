[package]
name = "sense-rs"
version = "0.3.0"
edition = "2024"
description = "Unofficial async and blocking client for the Sense energy monitor API"
license = "MIT"
repository = "https://github.com/rockstar/sense-rs"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE"]
keywords = ["sense", "energy", "home-automation", "power"]
categories = ["api-bindings"]

[lib]
name = "sense"

[package.metadata.docs.rs]
# Labels target-gated items with the platform they need (nightly `doc_cfg`).
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-wasip2"]

[dependencies]
form_urlencoded = "1.2.2"
http = "1.5.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync"] }

# `NativeTransport`, the realtime feed and the blocking client.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5" }
rmpv = { version = "1.3.1", features = ["with-serde"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

# `WasiTransport`.
[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wstd = { version = "0.6.8", default-features = false }

# No system clock on wasm32-unknown-unknown; read it from JavaScript instead.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "io-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
missing_docs = "deny"
