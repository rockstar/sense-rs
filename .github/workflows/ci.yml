# Mirrors the prek hooks in .pre-commit-config.yaml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # `native` and `wasi` are mutually exclusive, so never `--all-features`.
      - run: cargo clippy --all-targets --target wasm32-wasip2 --no-default-features --features wasi -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc
      # Runs under wasmtime via the runner in .cargo/config.toml. Doctests are native-only.
      - run: cargo test --lib --target wasm32-wasip2 --no-default-features --features wasi
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features
      # The WASI API differs from native. Checked on the host target because
      # cargo-semver-checks fails to build rustdoc with `--target wasm32-wasip2`.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: only-explicit-features
          features: wasi
