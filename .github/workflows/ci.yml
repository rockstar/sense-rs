# Mirrors the prek hooks in .pre-commit-config.yaml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo fmt --all -- --check
      # The crate has no features; this guards against adding non-additive ones.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The native examples don't build for wasm.
      - run: cargo clippy --lib --tests --example wasi --target wasm32-wasip2 -- -D warnings
      # Core only: no built-in transport, clock read from JavaScript.
      - run: cargo clippy --lib --tests --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc
      # Runs under wasmtime via the runner in .cargo/config.toml. Doctests are native-only.
      - run: cargo test --lib --target wasm32-wasip2
      # Default features only: the 0.2.x baseline can't build with `--all-features`.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features
