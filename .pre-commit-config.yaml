# Hooks run by prek (https://github.com/j178/prek). Install with `prek install`.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (deny warnings)
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-clippy-wasi
        name: cargo clippy wasi (deny warnings)
        entry: cargo clippy --lib --tests --example wasi --target wasm32-wasip2 -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-clippy-wasm-unknown
        name: cargo clippy wasm32-unknown-unknown (deny warnings)
        entry: cargo clippy --lib --tests --target wasm32-unknown-unknown -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test-doc
        name: cargo test --doc
        entry: cargo test --doc
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test-wasi
        name: cargo test wasi (needs wasmtime)
        entry: cargo test --lib --target wasm32-wasip2
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-test-wasm-unknown
        name: cargo test wasm32-unknown-unknown (needs node + wasm-bindgen-cli)
        entry: cargo test --lib --target wasm32-unknown-unknown
        language: system
        types_or: [rust, toml]
        pass_filenames: false

      - id: cargo-semver-checks
        name: cargo semver-checks
        entry: cargo semver-checks --default-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
