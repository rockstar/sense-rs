[package]
name = "sense-rs"
version = "0.1.2"
edition = "2024"
description = "Unofficial async and blocking client for the Sense energy monitor API"
license = "MIT"
repository = "https://github.com/rockstar/sense-rs"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "LICENSE"]
keywords = ["sense", "energy", "home-automation", "power"]
categories = ["api-bindings"]

[lib]
name = "sense"

[package.metadata.docs.rs]
# Labels feature-gated items with the feature they need (nightly `doc_cfg`).
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native"]
## reqwest for HTTP, plus the realtime feed and the blocking client. Conflicts with `wasi`.
native = [
    "dep:futures-util",
    "dep:reqwest",
    "dep:rmpv",
    "dep:tokio-tungstenite",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/time",
]
## wasi-http (via wstd) for HTTP on wasm32-wasip2. No realtime feed or
## blocking client. Conflicts with `native`.
wasi = ["dep:form_urlencoded", "dep:wstd"]

[dependencies]
form_urlencoded = { version = "1.2.2", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
http = "1.5.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", features = ["form", "query"], optional = true }
rmpv = { version = "1.3.1", features = ["with-serde"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"], optional = true }
wstd = { version = "0.6.8", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "io-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
missing_docs = "deny"

[[example]]
name = "realtime"
required-features = ["native"]

[[example]]
name = "sync"
required-features = ["native"]

[[example]]
name = "wasi"
required-features = ["wasi"]
